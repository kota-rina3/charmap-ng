name: charmap-ng-arm64

on:
  workflow_dispatch:
    branch: master

jobs:
  build:
    name: 编译构建
    runs-on: ubuntu-24.04-arm
    container: linuxdeepin/deepin:crimson-arm64

    steps:
    - name: 检查代码
      uses: actions/checkout@v4

    - name: 安装所需依赖
      run: |
        apt update && apt upgrade -y
        apt install -y \
          python3-dev python3-pip build-essential \
          python3-pyqt6 pyqt6-dev-tools patchelf

    - name: 安装 Python 模块
      run: |
        pip3 config set global.index-url https://mirrors.aliyun.com/pypi/simple
        pip3 install nuitka==4.0.8 zstandard --break-system-packages

    - name: 编译
      run: |
        nuitka --onefile --standalone --windows-console-mode=disable --windows-icon-from-ico=./ui/charmap.ico --show-progress --lto=yes --jobs=4 --enable-plugins=pyqt6 --include-data-dir=./ui=./ui charmap-ng.py
        mkdir ./charmap-ng
        cp *.bin ./charmap-ng/

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: charmap-ng-arm64
        path: ./charmap-ng/
